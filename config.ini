; Configuración de GameStar
;
; Infraestructura (1.4.2 y RNF07): una computadora actúa como servidor con la base
; de datos central y las laptops de cada sucursal se conectan a ella.
;
;  - En la computadora servidor:   python -m gamestar.servidor
;  - En cada laptop de sucursal:   modo = red, servidor = <IP del servidor>
;                                  python -m gamestar
;  - Todo en un solo equipo:       modo = local

[conexion]
modo = local
servidor = 127.0.0.1
puerto = 8765
; segundos sin respuesta antes de avisar que no hay conexión
tiempo_espera = 8
; carpeta donde se guardan los registros de venta emitidos
comprobantes = comprobantes

[servidor]
escuchar_en = 0.0.0.0
puerto = 8765
base_datos = datos/gamestar.db
